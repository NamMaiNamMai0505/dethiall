apiVersion: batch/v1
kind: Job
metadata:
  name: qlhv-import-lessons
  namespace: tkb
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import-lessons
          image: IMAGE_PLACEHOLDER
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo ">> Running ARTISAN_COMMAND_PLACEHOLDER (APPLY_FLAG_PLACEHOLDER)..."
              php artisan ARTISAN_COMMAND_PLACEHOLDER APPLY_FLAG_PLACEHOLDER
              echo ">> Done."
          envFrom:
            - secretRef:
                name: tkb-env
          volumeMounts:
            - name: env-file
              mountPath: /var/www/.env
              subPath: .env
      volumes:
        - name: env-file
          secret:
            secretName: tkb-env
