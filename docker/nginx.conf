user www-data;
worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    log_format app '$remote_addr - $remote_user [$time_local] "$request" '
                   'status=$status bytes=$body_bytes_sent request_time=$request_time '
                   'upstream_status=$upstream_status upstream_time=$upstream_response_time '
                   'import_id=$http_x_import_id';
    access_log /dev/stdout app;
    error_log /dev/stderr warn;

    # Khai báo rõ các thư mục temp thay vì phụ thuộc đường dẫn mặc định của
    # package Alpine. entrypoint đảm bảo www-data có quyền ghi tại đây.
    client_body_temp_path /var/lib/nginx/tmp/client_body 1 2;
    proxy_temp_path /var/lib/nginx/tmp/proxy 1 2;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi 1 2;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi 1 2;
    scgi_temp_path /var/lib/nginx/tmp/scgi 1 2;

    server {
        listen 8000;
        server_name _;
        root /var/www/public;
        index index.php;

        client_max_body_size 100M;
        client_body_timeout 600s;
        send_timeout 600s;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 600s;
            fastcgi_read_timeout 600s;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
