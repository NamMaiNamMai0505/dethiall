name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tkb
  LOCAL_REGISTRY: registry.hc2
  LOCAL_PROJECT: cdhc2
  K8S_NAMESPACE: tkb
  K8S_DEPLOYMENT: tkb

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=0.1

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  mirror-and-deploy:
    needs: build-and-push-ghcr
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          version: 1.90.6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEST_IPv4 }} >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            cdhc2-itn@${{ secrets.DEST_IPv4 }} \
            "echo 'SSH OK'; hostname"

      - name: Mirror image to local registry and roll out
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            cdhc2-itn@${{ secrets.DEST_IPv4 }} << EOF
          set -e
          echo "== Logging into GHCR to pull the freshly built image =="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} --password-stdin

          echo "== Pulling latest image from GHCR =="
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

          echo "== Tagging for local registry =="
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.LOCAL_REGISTRY }}/${{ env.LOCAL_PROJECT }}/${{ env.IMAGE_NAME }}:latest

          echo "== Pushing to local registry (${{ env.LOCAL_REGISTRY }}) =="
          docker push ${{ env.LOCAL_REGISTRY }}/${{ env.LOCAL_PROJECT }}/${{ env.IMAGE_NAME }}:latest

          echo "== Rolling out deployment =="
          kubectl rollout restart deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}

          echo "== Waiting for rollout to finish =="
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s

          echo "✅ Deploy completed successfully!"
          EOF
