services:
  db:
    image: docker.io/bitnami/mariadb:10.11
    environment:
      - MARIADB_ROOT_PASSWORD=Cntt@Hc2
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=Cntt@Hc2
      - MARIADB_DATABASE=eduka_v2
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    ports:
      - "3310:3306"
    volumes:
      - "mariadb_data:/bitnami/mariadb"
    healthcheck:
      test: ["CMD", "/opt/bitnami/mariadb/bin/mariadb-admin", "ping"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped
  app:
    build:
      context: .
    container_name: qlhl-cdhc2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/var/www/.env
    environment:
      - RUN_MIGRATIONS=false
      - APP_ENV=production
volumes:
  mariadb_data:
    driver: local
